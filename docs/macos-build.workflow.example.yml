name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned macOS app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Placeholder until Xcode project exists
        run: |
          echo "SwiftUI project not created yet."
          echo "Next step: add OpenClawMedia.xcodeproj or Package.swift."
