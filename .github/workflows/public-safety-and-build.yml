name: public-safety-and-build

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/public_safety_check.py
      - run: python3 scripts/validate_medialib_structure.py

  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4 (Swift 5.10 — matches upstream MediaLib build)
        run: |
          set -euo pipefail
          # macos-14 ships several Xcodes; upstream built on the Swift 5.9/5.10
          # toolchain. Xcode 16's stricter concurrency/type-check breaks the
          # upstream sources, so pin 15.x. Fall back to newest 15.x present.
          XC="/Applications/Xcode_15.4.app"
          if [[ ! -d "$XC" ]]; then
            XC="$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -1 || true)"
          fi
          test -n "$XC" && test -d "$XC"
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          swift --version
          xcodebuild -version

      - name: Install libmpv + ffmpeg (runtime deps bundled into the .app)
        run: |
          set -euo pipefail
          brew update
          brew install mpv ffmpeg
          # mpv formula provides libmpv.*.dylib under the brew prefix
          ls -l "$(brew --prefix)/lib/" | grep -i mpv || true

      - name: Build + package DMG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/medialib/package_dmg.sh
          ./scripts/medialib/package_dmg.sh

      - name: Locate DMG
        id: dmg
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="dist/MediaLib.dmg"
          test -f "$DMG_PATH"
          ls -lh "$DMG_PATH"
          echo "path=$DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaLib-macOS-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Publish latest release DMG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Latest unsigned macOS DMG built from ${GITHUB_SHA}. Open the DMG and drag MediaLIB to Applications. Requires libmpv at runtime; it is bundled into the .app."
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "MediaLib latest" --notes "$NOTES"
          gh release edit latest --title "MediaLib latest" --notes "$NOTES" --latest
          gh release upload latest "${{ steps.dmg.outputs.path }}" --clobber
