name: public-safety-and-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/public_safety_check.py

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package
        run: swift build -v
