name: public-safety-and-build

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/public_safety_check.py
      - run: python3 scripts/validate_source_config.py
      - run: python3 scripts/validate_source_compat.py
      - run: python3 scripts/validate_figma_ui.py

  macos-build:
    runs-on: macos-14
    env:
      APP_VERSION: 0.2.1
      APP_BUILD: 3
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift package
        run: swift build -c release -v

      - name: Create unsigned .app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="OpenClaw Media"
          BUNDLE_DIR="$PWD/build/${APP_NAME}.app"
          CONTENTS="$BUNDLE_DIR/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          rm -rf "$PWD/build"
          mkdir -p "$MACOS" "$RESOURCES"
          cp ".build/release/OpenClawMedia" "$MACOS/OpenClawMedia"
          chmod +x "$MACOS/OpenClawMedia"
          cp config.example.json "$RESOURCES/config.example.json"

          cat > "$CONTENTS/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>OpenClawMedia</string>
            <key>CFBundleIdentifier</key>
            <string>ai.nous.openclaw-media</string>
            <key>CFBundleName</key>
            <string>OpenClaw Media</string>
            <key>CFBundleDisplayName</key>
            <string>OpenClaw Media</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${APP_BUILD}</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$BUNDLE_DIR"
          find "$BUNDLE_DIR" -maxdepth 3 -type f -print

      - name: Package DMG
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="OpenClaw Media"
          DMG_DIR="$PWD/build/dmg-root"
          mkdir -p "$DMG_DIR"
          cp -R "$PWD/build/${APP_NAME}.app" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"
          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$DMG_DIR" \
            -ov \
            -format UDZO \
            "$PWD/build/OpenClaw-Media-macOS.dmg"
          hdiutil verify "$PWD/build/OpenClaw-Media-macOS.dmg"
          ls -lh "$PWD/build/OpenClaw-Media-macOS.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Media-macOS-dmg
          path: build/OpenClaw-Media-macOS.dmg
          if-no-files-found: error

      - name: Publish latest release DMG
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Latest unsigned macOS DMG built from ${GITHUB_SHA}. Open the DMG and drag OpenClaw Media to Applications."
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "OpenClaw Media latest" --notes "$NOTES"
          gh release edit latest --title "OpenClaw Media latest" --notes "$NOTES" --latest
          gh release upload latest build/OpenClaw-Media-macOS.dmg --clobber
